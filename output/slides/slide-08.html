<!DOCTYPE html>
<!-- slide-08: 수익화① 드랍쉬핑 — bullets_keyword 레이아웃 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 34pt 44pt 28pt;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .section-label {
      font-size: 10pt; color: #3b82f6; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 7pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 14pt;
    }
    .content-row {
      display: flex; gap: 16pt; flex: 1;
    }
    .bullets-col { flex: 1; display: flex; flex-direction: column; gap: 7pt; }
    .stat-col { width: 160pt; display: flex; flex-direction: column; gap: 7pt; }
    .bullet-item {
      display: flex; align-items: center; gap: 10pt;
      background: #1a1a1a; border-radius: 4pt; padding: 9pt 12pt;
    }
    .bullet-dot {
      width: 6pt; height: 6pt; background: #3b82f6;
      border-radius: 50%; flex-shrink: 0;
    }
    .bullet-label { font-size: 11pt; font-weight: 700; color: #ffffff; min-width: 70pt; }
    .bullet-body { font-size: 10pt; font-weight: 400; color: #b0b0b0; }
    .stat-card {
      background: #1e2d4a; border-radius: 6pt; padding: 12pt;
      flex: 1; display: flex; flex-direction: column; justify-content: center;
    }
    .stat-value { font-size: 20pt; font-weight: 800; color: #3b82f6; line-height: 1.1; }
    .stat-label { font-size: 9pt; color: #7db4f5; margin-top: 4pt; }
    .source { font-size: 8.5pt; color: #555; margin-top: 10pt; }
  </style>
</head>
<body>
  <p class="section-label">수익화 ①</p>
  <p class="slide-title">드랍쉬핑 — 재고 0, 지금 바로 시작</p>
  <div class="content-row">
    <div class="bullets-col">
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">구조</p>
        <p class="bullet-body">재고 없이 주문→공급업체 직배송</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">글로벌 시장</p>
        <p class="bullet-body">$4,644억 달러 (이커머스의 23%)</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">마진</p>
        <p class="bullet-body">15~20% / 전통 소매 대비 50%↑</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">수익 범위</p>
        <p class="bullet-body">초보 월 $0~5,000 / 경험자 $10,000~50,000</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">성공 키</p>
        <p class="bullet-body">틈새시장 + 콘텐츠 마케팅 결합</p>
      </div>
    </div>
    <div class="stat-col">
      <div class="stat-card">
        <p class="stat-value">$4,644억</p>
        <p class="stat-label">글로벌 드랍쉬핑 시장</p>
      </div>
      <div class="stat-card">
        <p class="stat-value">15~20%</p>
        <p class="stat-label">평균 마진율</p>
      </div>
    </div>
  </div>
  <p class="source">출처: Thunderbit, Shopify 2025</p>
</body>
</html>
