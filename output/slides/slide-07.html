<!DOCTYPE html>
<!-- slide-07: 수익화 모델 비교 — 5가지 모델 테이블 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 32pt 44pt 28pt;
      overflow: hidden;
    }
    .section-label {
      font-size: 10pt; color: #f59e0b; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 7pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 16pt;
    }
    .table-header {
      display: grid;
      grid-template-columns: 1.2fr 0.7fr 0.7fr 1.4fr 0.8fr;
      background: #252525;
      border-radius: 4pt 4pt 0 0;
      padding: 8pt 12pt;
    }
    .th {
      font-size: 9pt; font-weight: 600; color: #888; letter-spacing: 0.05em;
    }
    .table-body { display: flex; flex-direction: column; }
    .table-row {
      display: grid;
      grid-template-columns: 1.2fr 0.7fr 0.7fr 1.4fr 0.8fr;
      background: #1a1a1a;
      border-bottom: 1pt solid #252525;
      padding: 9pt 12pt;
      align-items: center;
    }
    .table-row:last-child { border-radius: 0 0 4pt 4pt; border-bottom: none; }
    .row-model { font-size: 12pt; font-weight: 700; color: #ffffff; }
    .badge-low { background: #1a2d24; border-radius: 10pt; padding: 2pt 8pt; display: inline-block; }
    .badge-mid { background: #2d2a1a; border-radius: 10pt; padding: 2pt 8pt; display: inline-block; }
    .badge-high { background: #2d1a1a; border-radius: 10pt; padding: 2pt 8pt; display: inline-block; }
    .badge-low-text { font-size: 9pt; font-weight: 600; color: #10b981; }
    .badge-mid-text { font-size: 9pt; font-weight: 600; color: #f59e0b; }
    .badge-high-text { font-size: 9pt; font-weight: 600; color: #ef4444; }
    .row-revenue { font-size: 10pt; color: #b0b0b0; }
    .row-time { font-size: 10pt; color: #888; }
  </style>
</head>
<body>
  <p class="section-label">수익화 모델 비교</p>
  <p class="slide-title">5가지 모델 — 자본·난이도·수익 비교</p>
  <div class="table-header">
    <p class="th">모델</p>
    <p class="th">초기 자본</p>
    <p class="th">난이도</p>
    <p class="th">월 수익 잠재력</p>
    <p class="th">시간 투자</p>
  </div>
  <div class="table-body">
    <div class="table-row">
      <p class="row-model">드랍쉬핑</p>
      <div class="badge-low"><p class="badge-low-text">낮음</p></div>
      <div class="badge-mid"><p class="badge-mid-text">중</p></div>
      <p class="row-revenue">100만~500만원</p>
      <p class="row-time">중</p>
    </div>
    <div class="table-row">
      <p class="row-model">디지털 제품</p>
      <div class="badge-low"><p class="badge-low-text">최소</p></div>
      <div class="badge-low"><p class="badge-low-text">낮음</p></div>
      <p class="row-revenue">50만~5,000만원</p>
      <p class="row-time">초기↑ 유지↓</p>
    </div>
    <div class="table-row">
      <p class="row-model">해외 셀러</p>
      <div class="badge-mid"><p class="badge-mid-text">중</p></div>
      <div class="badge-high"><p class="badge-high-text">중~높음</p></div>
      <p class="row-revenue">200만~수억</p>
      <p class="row-time">높음</p>
    </div>
    <div class="table-row">
      <p class="row-model">구독+D2C</p>
      <div class="badge-mid"><p class="badge-mid-text">중</p></div>
      <div class="badge-high"><p class="badge-high-text">높음</p></div>
      <p class="row-revenue">안정 반복수익</p>
      <p class="row-time">높음</p>
    </div>
    <div class="table-row">
      <p class="row-model">라이브커머스</p>
      <div class="badge-low"><p class="badge-low-text">낮음</p></div>
      <div class="badge-low"><p class="badge-low-text">낮음</p></div>
      <p class="row-revenue">100만~1,000만원</p>
      <p class="row-time">중</p>
    </div>
  </div>
</body>
</html>
