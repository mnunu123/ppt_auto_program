<!DOCTYPE html>
<!-- slide-05: 트렌드① 발견형 쇼핑 — bullets_keyword 레이아웃 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 34pt 44pt 28pt;
      overflow: hidden;
    }
    .section-label {
      font-size: 10pt; color: #3b82f6; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 7pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 14pt;
    }
    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 8pt;
    }
    .bullet-item {
      display: flex;
      align-items: center;
      gap: 12pt;
      background: #1a1a1a;
      border-radius: 4pt;
      padding: 9pt 14pt;
    }
    .bullet-dot {
      width: 6pt; height: 6pt; background: #3b82f6;
      border-radius: 50%; flex-shrink: 0;
    }
    .bullet-label {
      font-size: 12pt; font-weight: 700; color: #ffffff; min-width: 110pt;
    }
    .bullet-body {
      font-size: 11pt; font-weight: 400; color: #b0b0b0;
    }
    .highlight-box {
      background: #1e2d4a;
      border: 1pt solid #3b82f6;
      border-radius: 4pt;
      padding: 9pt 14pt;
      margin-top: 10pt;
    }
    .highlight-text {
      font-size: 11pt; color: #7db4f5; font-weight: 600;
    }
    .source {
      font-size: 8.5pt; color: #555; margin-top: 8pt;
    }
  </style>
</head>
<body>
  <p class="section-label">트렌드 ①</p>
  <p class="slide-title">검색 → 발견 — 피드가 쇼핑 시작점</p>
  <div class="bullet-list">
    <div class="bullet-item">
      <div class="bullet-dot"></div>
      <p class="bullet-label">89% 영상 구매</p>
      <p class="bullet-body">소비자 89%가 영상 보고 구매 결정</p>
    </div>
    <div class="bullet-item">
      <div class="bullet-dot"></div>
      <p class="bullet-label">틱톡·인스타·유튜브</p>
      <p class="bullet-body">쇼츠·릴스가 구매 출발점으로 전환</p>
    </div>
    <div class="bullet-item">
      <div class="bullet-dot"></div>
      <p class="bullet-label">AI 개인화</p>
      <p class="bullet-body">적용 시 매출 15% 이상 향상</p>
    </div>
    <div class="bullet-item">
      <div class="bullet-dot"></div>
      <p class="bullet-label">소셜커머스</p>
      <p class="bullet-body">글로벌 $5,477억 달러 (2025)</p>
    </div>
  </div>
  <div class="highlight-box">
    <p class="highlight-text">핵심: 검색창이 아닌 피드에서 제품을 발견 — 콘텐츠가 곧 매출</p>
  </div>
  <p class="source">출처: 토스페이먼츠, OSC 2025</p>
</body>
</html>
