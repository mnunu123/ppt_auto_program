<!DOCTYPE html>
<!-- slide-09: 수익화② 디지털 제품 — bullets_keyword + Easlo 사례 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 34pt 44pt 28pt;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .section-label {
      font-size: 10pt; color: #10b981; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 7pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 14pt;
    }
    .content-row { display: flex; gap: 16pt; flex: 1; }
    .bullets-col { flex: 1; display: flex; flex-direction: column; gap: 7pt; }
    .case-col { width: 170pt; }
    .bullet-item {
      display: flex; align-items: center; gap: 10pt;
      background: #1a1a1a; border-radius: 4pt; padding: 9pt 12pt;
    }
    .bullet-dot {
      width: 6pt; height: 6pt; background: #10b981;
      border-radius: 50%; flex-shrink: 0;
    }
    .bullet-label { font-size: 11pt; font-weight: 700; color: #ffffff; min-width: 70pt; }
    .bullet-body { font-size: 10pt; font-weight: 400; color: #b0b0b0; }
    .case-card {
      background: #1a2d24; border: 1pt solid #10b981;
      border-radius: 6pt; padding: 14pt; height: 100%;
      display: flex; flex-direction: column;
    }
    .case-tag { font-size: 9pt; color: #10b981; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 8pt; }
    .case-name { font-size: 20pt; font-weight: 800; color: #ffffff; margin-bottom: 12pt; }
    .case-stat { margin-bottom: 8pt; }
    .case-stat-val { font-size: 18pt; font-weight: 800; color: #10b981; line-height: 1; }
    .case-stat-desc { font-size: 9pt; color: #6ee7b7; margin-top: 2pt; }
    .source { font-size: 8.5pt; color: #555; margin-top: 10pt; }
  </style>
</head>
<body>
  <p class="section-label">수익화 ②</p>
  <p class="slide-title">디지털 제품 — 한 번 만들고 무한 판매</p>
  <div class="content-row">
    <div class="bullets-col">
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">구조</p>
        <p class="bullet-body">노션 템플릿·전자책·강의 — 추가 생산비 0</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">마진율</p>
        <p class="bullet-body">거의 100% — 가장 높은 수익 구조</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">판매 채널</p>
        <p class="bullet-body">Gumroad·Etsy·크몽·인프런·클래스101</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">진입가</p>
        <p class="bullet-body">3,900원~19,900원 (낮은 진입 장벽)</p>
      </div>
    </div>
    <div class="case-col">
      <div class="case-card">
        <p class="case-tag">REAL CASE</p>
        <p class="case-name">Easlo</p>
        <div class="case-stat">
          <p class="case-stat-val">5,000만원</p>
          <p class="case-stat-desc">월 매출 (노션 템플릿)</p>
        </div>
        <div class="case-stat">
          <p class="case-stat-val">5억원</p>
          <p class="case-stat-desc">2년 누적 매출</p>
        </div>
      </div>
    </div>
  </div>
  <p class="source">출처: 네버슬립 2024~2025</p>
</body>
</html>
