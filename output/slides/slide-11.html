<!DOCTYPE html>
<!-- slide-11: 수익화④ 구독+D2C — bullets_keyword + 반복수익 개념 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 34pt 44pt 28pt;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .section-label {
      font-size: 10pt; color: #3b82f6; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 7pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 14pt;
    }
    .content-row { display: flex; gap: 16pt; flex: 1; }
    .bullets-col { flex: 1; display: flex; flex-direction: column; gap: 8pt; }
    .concept-col { width: 160pt; display: flex; flex-direction: column; gap: 8pt; }
    .bullet-item {
      display: flex; align-items: center; gap: 10pt;
      background: #1a1a1a; border-radius: 4pt; padding: 11pt 12pt;
    }
    .bullet-dot {
      width: 6pt; height: 6pt; background: #3b82f6;
      border-radius: 50%; flex-shrink: 0;
    }
    .bullet-label { font-size: 11pt; font-weight: 700; color: #ffffff; min-width: 80pt; }
    .bullet-body { font-size: 10pt; font-weight: 400; color: #b0b0b0; }
    .concept-card {
      background: #1a1a1a; border-radius: 6pt; padding: 14pt;
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
    }
    .concept-icon { font-size: 24pt; margin-bottom: 6pt; }
    .concept-title { font-size: 11pt; font-weight: 700; color: #ffffff; margin-bottom: 4pt; }
    .concept-desc { font-size: 9pt; color: #888; }
    .source { font-size: 8.5pt; color: #555; margin-top: 10pt; }
  </style>
</head>
<body>
  <p class="section-label">수익화 ④</p>
  <p class="slide-title">구독+D2C — 자는 동안 들어오는 반복 수익</p>
  <div class="content-row">
    <div class="bullets-col">
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">반복 매출</p>
        <p class="bullet-body">Recurring Revenue로 사업 안정성 확보</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">루틴 소비</p>
        <p class="bullet-body">큐레이션 구독박스 · 디지털 콘텐츠 급성장</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">핵심 지표</p>
        <p class="bullet-body">고객 LTV(생애가치) 극대화</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">대표 사례</p>
        <p class="bullet-body">마켓컬리 정기배송 · 스타벅스 구독 · 뷰티 박스</p>
      </div>
    </div>
    <div class="concept-col">
      <div class="concept-card">
        <p class="concept-icon" style="color:#3b82f6;">&#9654;&#9654;</p>
        <p class="concept-title">한 번 결제</p>
        <p class="concept-desc">매달 자동 수익</p>
      </div>
      <div class="concept-card">
        <p class="concept-icon" style="color:#10b981;">&#9651;&#9651;</p>
        <p class="concept-title">LTV 극대화</p>
        <p class="concept-desc">고객 생애가치 단발 판매의 5배+</p>
      </div>
    </div>
  </div>
  <p class="source">출처: 업계 보고서 2025</p>
</body>
</html>
