<!DOCTYPE html>
<!-- slide-12: 3단계 실행 로드맵 — summary 레이아웃 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 32pt 44pt 28pt;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .section-label {
      font-size: 10pt; color: #3b82f6; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 8pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 18pt;
    }
    .steps-row { display: flex; gap: 12pt; margin-bottom: 16pt; }
    .step-card {
      flex: 1; background: #1a1a1a; border-radius: 6pt; padding: 16pt 14pt;
    }
    .step-num { font-size: 10pt; font-weight: 700; color: #3b82f6; letter-spacing: 0.1em; margin-bottom: 8pt; }
    .step-title { font-size: 13pt; font-weight: 700; color: #ffffff; margin-bottom: 6pt; }
    .step-desc { font-size: 10pt; font-weight: 400; color: #888; line-height: 1.4; }
    .key-message {
      background: #1e2d4a; border: 1pt solid #3b82f6;
      border-radius: 6pt; padding: 12pt 16pt; text-align: center;
    }
    .key-message-text { font-size: 13pt; font-weight: 700; color: #7db4f5; }
  </style>
</head>
<body>
  <p class="section-label">실행 로드맵</p>
  <p class="slide-title">지금 시작하는 3단계 로드맵</p>
  <div class="steps-row">
    <div class="step-card">
      <p class="step-num">STEP 1</p>
      <p class="step-title">선택</p>
      <p class="step-desc">자본·시간·역량에 맞는 모델 1개 선택</p>
    </div>
    <div class="step-card">
      <p class="step-num">STEP 2</p>
      <p class="step-title">테스트</p>
      <p class="step-desc">월 30만원 이내 소규모 테스트 — 데이터 수집</p>
    </div>
    <div class="step-card">
      <p class="step-num">STEP 3</p>
      <p class="step-title">스케일업</p>
      <p class="step-desc">검증된 채널에 집중 투자 — 자동화</p>
    </div>
  </div>
  <div class="key-message">
    <p class="key-message-text">완벽한 준비보다 작은 시작이 먼저다</p>
  </div>
</body>
</html>
