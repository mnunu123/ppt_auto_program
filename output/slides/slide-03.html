<!DOCTYPE html>
<!-- slide-03: 시장 규모 현황 — data_cards 레이아웃 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 36pt 44pt 32pt;
      overflow: hidden;
    }
    .section-label {
      font-size: 10pt; color: #3b82f6; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 8pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 20pt;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10pt;
      margin-bottom: 14pt;
    }
    .card {
      background: #1a1a1a;
      border-radius: 6pt;
      padding: 16pt 14pt;
      border-top: 2pt solid #3b82f6;
    }
    .card-value {
      font-size: 22pt; font-weight: 800; color: #3b82f6;
      line-height: 1.1; margin-bottom: 6pt;
    }
    .card-label {
      font-size: 11pt; font-weight: 700; color: #ffffff; margin-bottom: 4pt;
    }
    .card-desc {
      font-size: 9pt; color: #888; font-weight: 400;
    }
    .source {
      font-size: 8.5pt; color: #555;
    }
  </style>
</head>
<body>
  <p class="section-label">시장 현황</p>
  <p class="slide-title">이커머스 — 성숙했지만 기회는 여전히 크다</p>
  <div class="cards-grid">
    <div class="card">
      <p class="card-value">242조</p>
      <p class="card-label">국내 시장</p>
      <p class="card-desc">2024 사상 최대 / +6% YoY</p>
    </div>
    <div class="card">
      <p class="card-value">$5.06조</p>
      <p class="card-label">글로벌 시장</p>
      <p class="card-desc">2025년 기준 / +8.3% 성장</p>
    </div>
    <div class="card">
      <p class="card-value">27.7억</p>
      <p class="card-label">온라인 쇼핑객</p>
      <p class="card-desc">전 세계 기준 / 2025년</p>
    </div>
    <div class="card">
      <p class="card-value">20.5%</p>
      <p class="card-label">소매 비중</p>
      <p class="card-desc">전체 소매 중 온라인 비중</p>
    </div>
  </div>
  <p class="source">출처: 통계청, Shopify, SellersCommerce 2024~2025</p>
</body>
</html>
