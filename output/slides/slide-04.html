<!DOCTYPE html>
<!-- slide-04: 국내 플랫폼 지형 — bullets_keyword 레이아웃 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 36pt 44pt 30pt;
      overflow: hidden;
    }
    .section-label {
      font-size: 10pt; color: #3b82f6; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 8pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 18pt;
    }
    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 9pt;
    }
    .bullet-item {
      display: flex;
      align-items: center;
      gap: 12pt;
      background: #1a1a1a;
      border-radius: 4pt;
      padding: 11pt 14pt;
    }
    .bullet-dot {
      width: 6pt; height: 6pt; background: #3b82f6;
      border-radius: 50%; flex-shrink: 0;
    }
    .bullet-label {
      font-size: 12pt; font-weight: 700; color: #ffffff; min-width: 90pt;
    }
    .bullet-body {
      font-size: 11pt; font-weight: 400; color: #b0b0b0;
    }
    .source {
      font-size: 8.5pt; color: #555; margin-top: 12pt;
    }
  </style>
</head>
<body>
  <p class="section-label">플랫폼 지형</p>
  <p class="slide-title">쿠팡·네이버 양강 — 틈새 기회는 어디에</p>
  <div class="bullet-list">
    <div class="bullet-item">
      <div class="bullet-dot"></div>
      <p class="bullet-label">쿠팡 1위</p>
      <p class="bullet-body">점유율 24.5%, 결제금액 55조 (+24%)</p>
    </div>
    <div class="bullet-item">
      <div class="bullet-dot"></div>
      <p class="bullet-label">네이버 2위</p>
      <p class="bullet-body">점유율 23.3%, 검색 연계 쇼핑 강세</p>
    </div>
    <div class="bullet-item">
      <div class="bullet-dot"></div>
      <p class="bullet-label">나머지</p>
      <p class="bullet-body">G마켓·옥션·SSG 10.1% / 11번가 7% / 카카오 5%</p>
    </div>
    <div class="bullet-item">
      <div class="bullet-dot"></div>
      <p class="bullet-label">틈새 전략</p>
      <p class="bullet-body">수수료↑ → D2C·버티컬 이탈 증가 — 자사몰 기회 확대</p>
    </div>
  </div>
  <p class="source">출처: CEO스코어, 와이즈앱, TENANT news 2024</p>
</body>
</html>
