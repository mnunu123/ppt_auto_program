<!DOCTYPE html>
<!-- slide-02: 목차 슬라이드 — agenda 레이아웃 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 40pt 44pt 36pt;
      overflow: hidden;
    }
    .section-label {
      font-size: 10pt; color: #3b82f6; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 10pt;
    }
    .slide-title {
      font-size: 24pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 22pt;
    }
    .agenda-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10pt;
    }
    .agenda-item {
      background: #1a1a1a;
      border-left: 3pt solid #3b82f6;
      border-radius: 4pt;
      padding: 14pt 16pt;
      display: flex;
      align-items: flex-start;
      gap: 12pt;
    }
    .agenda-num {
      font-size: 20pt; font-weight: 800; color: #3b82f6;
      line-height: 1; flex-shrink: 0;
    }
    .agenda-text-col {}
    .agenda-title {
      font-size: 12pt; font-weight: 700; color: #ffffff; margin-bottom: 3pt;
    }
    .agenda-desc {
      font-size: 10pt; font-weight: 400; color: #888;
    }
  </style>
</head>
<body>
  <p class="section-label">목차</p>
  <p class="slide-title">오늘의 흐름</p>
  <div class="agenda-grid">
    <div class="agenda-item">
      <p class="agenda-num">01</p>
      <div class="agenda-text-col">
        <p class="agenda-title">시장 현황</p>
        <p class="agenda-desc">242조 시장의 기회</p>
      </div>
    </div>
    <div class="agenda-item">
      <p class="agenda-num">02</p>
      <div class="agenda-text-col">
        <p class="agenda-title">핵심 트렌드</p>
        <p class="agenda-desc">발견형·라이브·버티컬</p>
      </div>
    </div>
    <div class="agenda-item">
      <p class="agenda-num">03</p>
      <div class="agenda-text-col">
        <p class="agenda-title">수익화 모델</p>
        <p class="agenda-desc">드랍쉬핑·디지털·해외·구독</p>
      </div>
    </div>
    <div class="agenda-item">
      <p class="agenda-num">04</p>
      <div class="agenda-text-col">
        <p class="agenda-title">실행 로드맵</p>
        <p class="agenda-desc">지금 당장 시작하는 법</p>
      </div>
    </div>
  </div>
</body>
</html>
