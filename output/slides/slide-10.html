<!DOCTYPE html>
<!-- slide-10: 수익화③ 해외 셀러 K파워 — bullets_keyword + 수치 강조 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 34pt 44pt 28pt;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .section-label {
      font-size: 10pt; color: #f59e0b; font-weight: 600;
      letter-spacing: 0.15em; margin-bottom: 7pt;
    }
    .slide-title {
      font-size: 22pt; font-weight: 700; color: #ffffff;
      letter-spacing: -0.02em; margin-bottom: 14pt;
    }
    .content-row { display: flex; gap: 16pt; flex: 1; }
    .bullets-col { flex: 1; display: flex; flex-direction: column; gap: 8pt; }
    .stats-col { width: 160pt; display: flex; flex-direction: column; gap: 8pt; }
    .bullet-item {
      display: flex; align-items: center; gap: 10pt;
      background: #1a1a1a; border-radius: 4pt; padding: 10pt 12pt;
    }
    .bullet-dot {
      width: 6pt; height: 6pt; background: #f59e0b;
      border-radius: 50%; flex-shrink: 0;
    }
    .bullet-label { font-size: 11pt; font-weight: 700; color: #ffffff; min-width: 85pt; }
    .bullet-body { font-size: 10pt; font-weight: 400; color: #b0b0b0; }
    .stat-card {
      background: #2d2a1a; border-top: 2pt solid #f59e0b;
      border-radius: 6pt; padding: 12pt;
      flex: 1; display: flex; flex-direction: column; justify-content: center;
    }
    .stat-value { font-size: 22pt; font-weight: 800; color: #f59e0b; line-height: 1.1; }
    .stat-label { font-size: 9pt; color: #d4a44a; margin-top: 4pt; }
    .source { font-size: 8.5pt; color: #555; margin-top: 10pt; }
  </style>
</head>
<body>
  <p class="section-label">수익화 ③</p>
  <p class="slide-title">K파워 해외 셀러 — 역대 최고 기회</p>
  <div class="content-row">
    <div class="bullets-col">
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">아마존 K뷰티</p>
        <p class="bullet-body">1년간 +75%, 미국 화장품 시장 20%+ 점유</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">쇼피 K셀러</p>
        <p class="bullet-body">주문 +63% / K뷰티 +77% (2024)</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">5년 성장</p>
        <p class="bullet-body">쇼피 K셀러 주문 22배 · 거래액 18배 성장</p>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <p class="bullet-label">진입 방법</p>
        <p class="bullet-body">아마존 FBA / 쇼피 글로벌셀링 프로그램</p>
      </div>
    </div>
    <div class="stats-col">
      <div class="stat-card">
        <p class="stat-value">+75%</p>
        <p class="stat-label">아마존 K뷰티 성장</p>
      </div>
      <div class="stat-card">
        <p class="stat-value">22배</p>
        <p class="stat-label">쇼피 K셀러 5년 주문</p>
      </div>
    </div>
  </div>
  <p class="source">출처: 아마존 글로벌셀링, 쇼피코리아, 디지털투데이 2024</p>
</body>
</html>
